project_id = "r2q2-social-app"

[api]
enabled = true
port = 54321

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:3000"
# Required for the Gate 1 identity decision (RDD.md Section 6, Gate 1) --
# callers get an anonymous session before the Gate 3.5 account system exists.
enable_anonymous_sign_ins = true

[auth.email]
# Local/dev only: skips the confirmation-link round trip so the
# anonymous-session-upgrade and sign-up/sign-in flows (Gate 3.5) are
# testable without a real inbox. Revisit before a hosted/production project
# is linked -- production should require confirmation.
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
# Local Studio log viewer only; requires the Docker daemon exposed on a TCP
# port, which we don't enable. Not needed to exercise the draft endpoint.
enabled = false
